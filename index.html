<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JARVIS AI</title>
    <style>
        body { background: #0b0e14; color: #00f0ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .arc-reactor { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #00f0ff; box-shadow: 0 0 25px #00f0ff; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; cursor: pointer; }
        .arc-reactor.active { animation: pulse 1.5s infinite; border-color: #ff0055; box-shadow: 0 0 30px #ff0055; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        #status { font-size: 1.2rem; margin-bottom: 10px; }
        #transcript { color: #88a; max-width: 600px; text-align: center; }
    </style>
</head>
<body>
    <div class="arc-reactor" id="micBtn" onclick="toggleListening()">JARVIS</div>
    <div id="status">Tap Core to Speak</div>
    <div id="transcript"></div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                micBtn.classList.add('active');
                status.innerText = "Listening...";
            };

            recognition.onend = () => {
                micBtn.classList.remove('active');
                status.innerText = "Processing...";
            };

            recognition.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                transcript.innerText = `You: ${text}`;
                await askJarvis(text);
            };
        } else {
            status.innerText = "Speech Recognition not supported in this browser.";
        }

        function toggleListening() {
            if (synth.speaking) synth.cancel();
            recognition.start();
        }

        async function askJarvis(userText) {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: userText })
            });
            const data = await res.json();
            transcript.innerText += `\n\nJARVIS: ${data.reply}`;
            speak(data.reply);
        }

        function speak(text) {
            status.innerText = "Speaking...";
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.onend = () => { status.innerText = "Tap Core to Speak"; };
            synth.speak(utterance);
        }
    </script>
</body>
</html>
